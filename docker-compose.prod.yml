services:
  moncv:
    build: .
    container_name: moncv
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - moncv_data:/app/backend/data

  nginx:
    image: nginx:alpine
    container_name: moncv_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - moncv

  certbot:
    image: certbot/certbot
    container_name: moncv_certbot
    restart: unless-stopped
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    profiles:
      - certbot

volumes:
  moncv_data:
  certbot_data:
  certbot_www:
